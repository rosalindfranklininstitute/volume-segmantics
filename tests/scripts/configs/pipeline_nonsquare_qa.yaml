# QA pair to pipeline_nonsquare_smoke.yaml: real training on a 128 x 80 x 256
# crop of the vessel data under each augmentation backend, with the
# segmentation Dice of every prediction gated. A prediction cropped back at
# the wrong offset, or a pad that the model cannot train through, fails the
# gate.
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_nonsquare_qa
global_overrides:
  train:
    image_size: 256
    num_cyc_frozen: 8
    num_cyc_unfrozen: 5
    patience: 4
    starting_lr: 5.0e-05
    end_lr: 0.001
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: imagenet
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
      boundary:
        enabled: true
        loss: boundary_bce_dice
        loss_weight: 0.5
        width: 2
    targets:
      boundary:
        width: 2
tests:
- name: qa_crop_non_square
  type: crop_volume
  shape:
  - 128
  - 80
  - 256
- name: qa_train_nonsquare_albu
  type: train
  model_key: qa_nonsquare_albu
  overrides:
    train:
      model_output_fn: qa_nonsquare_albu
      augmentation_library: albumentations
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_nonsquare_albu
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_nonsquare_albu}
- name: qa_predict_nonsquare_albu_low
  type: predict
  model_key: qa_nonsquare_albu
  overrides:
    predict:
      augmentation_library: albumentations
      quality: low
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
    - '*_vol_pred_BND.*'
- name: qa_assert_dice_nonsquare_albu_low
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_nonsquare_albu_low_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_predict_nonsquare_albu_medium
  type: predict
  model_key: qa_nonsquare_albu
  overrides:
    predict:
      augmentation_library: albumentations
      quality: medium
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
    - '*_vol_pred_BND.*'
- name: qa_assert_dice_nonsquare_albu_medium
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_nonsquare_albu_medium_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_predict_nonsquare_albu_zarr
  type: pipeline_predict_zarr
  model_key: qa_nonsquare_albu
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: nonsquare_albu_zarr
  overrides:
    predict:
      augmentation_library: albumentations
- name: qa_assert_zarr_keys_nonsquare_albu
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:nonsquare_albu_zarr}
  - --keys
  - teacher_argmax
- name: qa_assert_zarr_dice_nonsquare_albu
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:nonsquare_albu_zarr}
  - --pred-key
  - teacher_argmax
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
