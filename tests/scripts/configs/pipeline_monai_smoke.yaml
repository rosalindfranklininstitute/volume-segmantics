# MONAI end to end: augmentation_library: monai in the train settings (the
# pipeline dataset's augmentation backend follows it) and in the predict
# settings, for a 2D model and a 2.5D model, through model-predict-2d and
# model-predict-pipeline. No other config sets the library, and prediction with
# MONAI stopped with "Cannot interpret 'torch.uint8' as a data type" (2D) and
# failed in the padding (2.5D) without a harness step to show it.
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_monai_smoke
global_overrides:
  train:
    image_size: 64
    num_cyc_frozen: 1
    num_cyc_unfrozen: 0
    patience: 1
    starting_lr: 0.0001
    end_lr: 0.0005
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    augmentation_library: monai
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: null
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
    augmentation_library: monai
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
tests:
- name: train_pipeline_monai_2d
  type: train
  model_key: pipeline_monai_2d
  overrides:
    train:
      model_output_fn: pipeline_monai_2d
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_monai_2d
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:pipeline_monai_2d}
- name: predict_monai_2d_low
  type: predict
  model_key: pipeline_monai_2d
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: predict_monai_2d_zarr
  type: pipeline_predict_zarr
  model_key: pipeline_monai_2d
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: monai_2d_zarr
- name: assert_zarr_keys_monai_2d
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:monai_2d_zarr}
  - --keys
  - teacher_argmax
- name: train_pipeline_monai_2_5d
  type: train
  model_key: pipeline_monai_2_5d
  overrides:
    train:
      model_output_fn: pipeline_monai_2_5d
      use_2_5d_slicing: true
      num_slices: 3
      slice_file_format: png
      skip_border_slices: false
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_monai_2_5d
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:pipeline_monai_2_5d}
- name: predict_monai_2_5d_low
  type: predict
  model_key: pipeline_monai_2_5d
  overrides:
    predict:
      use_2_5d_prediction: true
      num_slices: 3
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: predict_monai_2_5d_zarr
  type: pipeline_predict_zarr
  model_key: pipeline_monai_2_5d
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: monai_2_5d_zarr
  overrides:
    predict:
      use_2_5d_prediction: true
      num_slices: 3
- name: assert_zarr_keys_monai_2_5d
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:monai_2_5d_zarr}
  - --keys
  - teacher_argmax
