# QA pair to pipeline_predict_settings_smoke.yaml: really trained models,
# with the Dice of every prediction gated. The native_scale prediction is at
# twice the scale the model was trained at, so its gate is lower (0.5).
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_predict_settings_qa
global_overrides:
  train:
    image_size: 128
    num_cyc_frozen: 8
    num_cyc_unfrozen: 5
    patience: 4
    starting_lr: 5.0e-05
    end_lr: 0.001
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: imagenet
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
tests:
- name: qa_train_ps_base
  type: train
  model_key: qa_ps_base
  overrides:
    train:
      model_output_fn: qa_ps_base
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_ps_base
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_ps_base}
- name: qa_predict_ps_default
  type: predict
  model_key: qa_ps_base
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: qa_assert_dice_ps_default
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_ps_default_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_predict_ps_native_scale
  type: predict
  model_key: qa_ps_base
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
  overrides:
    predict:
      native_scale: true
- name: qa_assert_dice_ps_native_scale
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_ps_native_scale_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.5'
- name: qa_predict_ps_multi_axis_zarr
  type: pipeline_predict_zarr
  model_key: qa_ps_base
  inference_mode: multi_axis
  output_zarr: prediction.zarr
  zarr_key: ps_multi_axis_zarr
- name: qa_assert_zarr_keys_ps_multi_axis
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:ps_multi_axis_zarr}
  - --keys
  - teacher_argmax
- name: qa_assert_zarr_dice_ps_multi_axis
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:ps_multi_axis_zarr}
  - --pred-key
  - teacher_argmax
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_train_ps_no_clip
  type: train
  model_key: qa_ps_no_clip
  overrides:
    train:
      model_output_fn: qa_ps_no_clip
      clip_data: false
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_ps_no_clip
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_ps_no_clip}
- name: qa_predict_ps_no_clip
  type: predict
  model_key: qa_ps_no_clip
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
  overrides:
    predict:
