- name: qa_assert_dice_ps_no_clip
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_ps_no_clip_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_predict_ps_no_clip_zarr
  type: pipeline_predict_zarr
  model_key: qa_ps_no_clip
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: ps_no_clip_zarr
  overrides:
    predict:
