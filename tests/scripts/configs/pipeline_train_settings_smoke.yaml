- name: train_ts_encoder_weights
  type: train
  model_key: ts_encoder_weights
  overrides:
    train:
      model_output_fn: ts_encoder_weights
      encoder_weights_path: ${model:ts_lr_constant}
      model:
        encoder_weights: null
  assert_outputs:
