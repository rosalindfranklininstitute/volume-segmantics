# Train settings that no other config sets, one model each under the
# default trainer:
#
# - lr_policy: constant (no sweep and no schedule);
# - training_axes: Z (slices along one axis only);
# - dice_averaging: weighted, with eval_metric: DiceCoefficient;
# - precision: bf16-mixed;
# - full_weights_path, naming the first model's checkpoint;
# - encoder_weights_path, naming the same checkpoint (only its encoder
#   tensors are used), with no ImageNet weights.
#
# Each model is predicted with model-predict-2d. The segmentation-dice
# steps have a floor of 0 (a shape check); pipeline_train_settings_qa.yaml
# gates the Dice itself.
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_train_settings_smoke
global_overrides:
  train:
    image_size: 64
    num_cyc_frozen: 1
    num_cyc_unfrozen: 0
    patience: 1
    starting_lr: 0.0001
    end_lr: 0.0005
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: null
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
tests:
- name: train_ts_lr_constant
  type: train
  model_key: ts_lr_constant
  overrides:
    train:
      model_output_fn: ts_lr_constant
      lr_policy: constant
      starting_lr: 0.0001
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_ts_lr_constant
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:ts_lr_constant}
- name: predict_ts_lr_constant
  type: predict
  model_key: ts_lr_constant
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: assert_dice_ts_lr_constant
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_ts_lr_constant_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: train_ts_axis_z
  type: train
  model_key: ts_axis_z
  overrides:
    train:
      model_output_fn: ts_axis_z
      training_axes: Z
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_ts_axis_z
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:ts_axis_z}
- name: predict_ts_axis_z
  type: predict
  model_key: ts_axis_z
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: assert_dice_ts_axis_z
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_ts_axis_z_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: train_ts_dice_weighted
  type: train
  model_key: ts_dice_weighted
  overrides:
    train:
      model_output_fn: ts_dice_weighted
      eval_metric: DiceCoefficient
      dice_averaging: weighted
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_ts_dice_weighted
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:ts_dice_weighted}
- name: predict_ts_dice_weighted
  type: predict
  model_key: ts_dice_weighted
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: assert_dice_ts_dice_weighted
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_ts_dice_weighted_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: train_ts_bf16
  type: train
  model_key: ts_bf16
  overrides:
    train:
      model_output_fn: ts_bf16
      precision: bf16-mixed
  assert_outputs:
