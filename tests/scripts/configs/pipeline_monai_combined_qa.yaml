  model_key: qa_monai_pseudo_label
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: monai_pseudo_label_zarr
- name: qa_assert_zarr_keys_monai_pseudo_label
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:monai_pseudo_label_zarr}
  - --keys
  - teacher_argmax
- name: qa_assert_zarr_dice_monai_pseudo_label
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:monai_pseudo_label_zarr}
