# Predict settings that no other config sets:
#
# - native_scale: True, on a model trained at a smaller image_size than the
#   volume's slices, so the scale really differs from the default;
# - inference_mode: multi_axis through model-predict-pipeline;
# - clip_data: False, at training and at prediction;
# - use_imagenet_norm: False, at training and at prediction, through
#   model-predict-2d and model-predict-pipeline.
#
# The segmentation-dice steps have a floor of 0 (a shape check);
# pipeline_predict_settings_qa.yaml gates the Dice itself.
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_predict_settings_smoke
global_overrides:
  train:
    image_size: 64
    num_cyc_frozen: 1
    num_cyc_unfrozen: 0
    patience: 1
    starting_lr: 0.0001
    end_lr: 0.0005
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: null
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
tests:
- name: train_ps_base
  type: train
  model_key: ps_base
  overrides:
    train:
      model_output_fn: ps_base
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_ps_base
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:ps_base}
- name: predict_ps_default
  type: predict
  model_key: ps_base
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: assert_dice_ps_default
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_ps_default_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: predict_ps_native_scale
  type: predict
  model_key: ps_base
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
  overrides:
    predict:
      native_scale: true
- name: assert_dice_ps_native_scale
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_ps_native_scale_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: predict_ps_multi_axis_zarr
  type: pipeline_predict_zarr
  model_key: ps_base
  inference_mode: multi_axis
  output_zarr: prediction.zarr
  zarr_key: ps_multi_axis_zarr
- name: assert_zarr_keys_ps_multi_axis
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:ps_multi_axis_zarr}
  - --keys
  - teacher_argmax
- name: assert_zarr_dice_ps_multi_axis
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:ps_multi_axis_zarr}
  - --pred-key
  - teacher_argmax
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: train_ps_no_clip
  type: train
  model_key: ps_no_clip
  overrides:
    train:
      model_output_fn: ps_no_clip
      clip_data: false
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_ps_no_clip
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:ps_no_clip}
- name: predict_ps_no_clip
  type: predict
  model_key: ps_no_clip
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
  overrides:
    predict:
      clip_data: false
- name: assert_dice_ps_no_clip
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_ps_no_clip_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: predict_ps_no_clip_zarr
  type: pipeline_predict_zarr
  model_key: ps_no_clip
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: ps_no_clip_zarr
  overrides:
    predict:
      clip_data: false
- name: assert_zarr_dice_ps_no_clip
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:ps_no_clip_zarr}
  - --pred-key
  - teacher_argmax
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: train_ps_no_imagenet_norm
  type: train
  model_key: ps_no_imagenet_norm
  overrides:
    train:
      model_output_fn: ps_no_imagenet_norm
      use_imagenet_norm: false
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_ps_no_imagenet_norm
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:ps_no_imagenet_norm}
- name: predict_ps_no_imagenet_norm
  type: predict
  model_key: ps_no_imagenet_norm
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
  overrides:
    predict:
      use_imagenet_norm: false
- name: assert_dice_ps_no_imagenet_norm
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_ps_no_imagenet_norm_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: predict_ps_no_imagenet_norm_zarr
  type: pipeline_predict_zarr
  model_key: ps_no_imagenet_norm
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: ps_no_imagenet_norm_zarr
  overrides:
