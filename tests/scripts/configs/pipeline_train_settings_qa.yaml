# QA pair to pipeline_train_settings_smoke.yaml: a full training under each
# setting, with the Dice of the prediction gated.
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_train_settings_qa
global_overrides:
  train:
    image_size: 256
    num_cyc_frozen: 8
    num_cyc_unfrozen: 5
    patience: 4
    starting_lr: 5.0e-05
    end_lr: 0.001
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: imagenet
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
tests:
- name: qa_train_ts_lr_constant
  type: train
  model_key: qa_ts_lr_constant
  overrides:
    train:
      model_output_fn: qa_ts_lr_constant
      lr_policy: constant
      starting_lr: 0.0003
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_ts_lr_constant
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_ts_lr_constant}
- name: qa_predict_ts_lr_constant
  type: predict
  model_key: qa_ts_lr_constant
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: qa_assert_dice_ts_lr_constant
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_ts_lr_constant_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_train_ts_axis_z
  type: train
  model_key: qa_ts_axis_z
  overrides:
    train:
      model_output_fn: qa_ts_axis_z
      training_axes: Z
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_ts_axis_z
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_ts_axis_z}
- name: qa_predict_ts_axis_z
  type: predict
  model_key: qa_ts_axis_z
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: qa_assert_dice_ts_axis_z
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_ts_axis_z_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_train_ts_dice_weighted
  type: train
  model_key: qa_ts_dice_weighted
  overrides:
    train:
      model_output_fn: qa_ts_dice_weighted
      eval_metric: DiceCoefficient
      dice_averaging: weighted
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_ts_dice_weighted
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_ts_dice_weighted}
- name: qa_predict_ts_dice_weighted
  type: predict
  model_key: qa_ts_dice_weighted
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: qa_assert_dice_ts_dice_weighted
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_ts_dice_weighted_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_train_ts_bf16
  type: train
  model_key: qa_ts_bf16
  overrides:
    train:
      model_output_fn: qa_ts_bf16
      precision: bf16-mixed
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_ts_bf16
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_ts_bf16}
- name: qa_predict_ts_bf16
  type: predict
  model_key: qa_ts_bf16
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: qa_assert_dice_ts_bf16
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_ts_bf16_pred}
  - --gt-label
