# QA pair to pipeline_monai_smoke.yaml: trains real 2D and 2.5D models on the
# vessel data with augmentation_library: monai, predicts with MONAI through
# model-predict-2d and model-predict-pipeline, and gates the segmentation Dice
# of each prediction.
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_monai_qa
global_overrides:
  train:
    image_size: 512
    num_cyc_frozen: 8
    num_cyc_unfrozen: 5
    patience: 4
    starting_lr: 5.0e-05
    end_lr: 0.001
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    augmentation_library: monai
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: imagenet
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
    augmentation_library: monai
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
tests:
- name: qa_train_pipeline_monai_2d
  type: train
  model_key: qa_pipeline_monai_2d
  overrides:
    train:
      model_output_fn: qa_pipeline_monai_2d
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_monai_2d
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_pipeline_monai_2d}
- name: qa_predict_monai_2d_low
  type: predict
  model_key: qa_pipeline_monai_2d
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: qa_assert_dice_monai_2d
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_monai_2d_low_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.5'
- name: qa_predict_monai_2d_zarr
  type: pipeline_predict_zarr
  model_key: qa_pipeline_monai_2d
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: monai_2d_zarr
- name: qa_assert_zarr_keys_monai_2d
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:monai_2d_zarr}
  - --keys
  - teacher_argmax
- name: qa_assert_zarr_dice_monai_2d
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:monai_2d_zarr}
  - --pred-key
  - teacher_argmax
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.5'
- name: qa_train_pipeline_monai_2_5d
  type: train
  model_key: qa_pipeline_monai_2_5d
  overrides:
    train:
      model_output_fn: qa_pipeline_monai_2_5d
      use_2_5d_slicing: true
      num_slices: 3
      slice_file_format: png
      skip_border_slices: false
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_monai_2_5d
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_pipeline_monai_2_5d}
- name: qa_predict_monai_2_5d_low
  type: predict
  model_key: qa_pipeline_monai_2_5d
  overrides:
    predict:
      use_2_5d_prediction: true
      num_slices: 3
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
- name: qa_assert_dice_monai_2_5d
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_monai_2_5d_low_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.5'
- name: qa_predict_monai_2_5d_zarr
  type: pipeline_predict_zarr
  model_key: qa_pipeline_monai_2_5d
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: monai_2_5d_zarr
  overrides:
    predict:
      use_2_5d_prediction: true
      num_slices: 3
- name: qa_assert_zarr_keys_monai_2_5d
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:monai_2_5d_zarr}
  - --keys
  - teacher_argmax
- name: qa_assert_zarr_dice_monai_2_5d
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:monai_2_5d_zarr}
  - --pred-key
  - teacher_argmax
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.5'
