# QA pair to pipeline_downsample_smoke.yaml: real training and prediction
# with downsample: True, with the Dice of every prediction against the
# full-size labels gated. Labels that do not follow the image down at
# training, or a prediction that is put back out of register, fail the gate.
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_downsample_qa
global_overrides:
  train:
    image_size: 256
    num_cyc_frozen: 8
    num_cyc_unfrozen: 5
    patience: 4
    starting_lr: 5.0e-05
    end_lr: 0.001
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    downsample: true
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: imagenet
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
    downsample: true
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
      boundary:
        enabled: true
        loss: boundary_bce_dice
        loss_weight: 0.5
        width: 2
    targets:
      boundary:
        width: 2
tests:
- name: qa_train_downsample
  type: train
  model_key: qa_downsample_model
  overrides:
    train:
      model_output_fn: qa_downsample_model
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: qa_assert_bn_trained_downsample
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:qa_downsample_model}
- name: qa_predict_downsample_low
  type: predict
  model_key: qa_downsample_model
  overrides:
    predict:
      quality: low
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
    - '*_vol_pred_BND.*'
- name: qa_assert_dice_downsample_low
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_downsample_low_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_predict_downsample_medium
  type: predict
  model_key: qa_downsample_model
  overrides:
    predict:
      quality: medium
      output_probs: true
      output_entropy: true
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
    - '*_vol_pred_BND.*'
- name: qa_assert_dice_downsample_medium
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:qa_predict_downsample_medium_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
- name: qa_predict_downsample_zarr
  type: pipeline_predict_zarr
  model_key: qa_downsample_model
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: downsample_zarr
- name: qa_assert_zarr_keys_downsample
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:downsample_zarr}
  - --keys
  - teacher_argmax
  - teacher_probs
- name: qa_assert_zarr_dice_downsample
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:downsample_zarr}
  - --pred-key
  - teacher_argmax
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.7'
