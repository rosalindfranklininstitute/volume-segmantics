# The downsample: True round trip, which no other config sets. Training
# takes every second voxel of the image and the labels; prediction takes
# every second voxel of the volume and returns every output at the input
# volume's shape. Run through model-predict-2d (low, and medium with
# probabilities and entropy) and model-predict-pipeline.
#
# The segmentation-dice steps score against the full-size labels with a
# floor of 0: they are here for their shape check, which fails an output
# left at half size. pipeline_downsample_qa.yaml gates the Dice itself.
paths:
  image: training_data/vessels_256cube_DATA.h5
  label: training_data/vessels_256cube_LABELS.h5
settings_templates:
  train: volseg-settings/2d_model_train_settings.yaml
  predict: volseg-settings/2d_model_predict_settings.yaml
output_root: tmp/pipeline_downsample_smoke
global_overrides:
  train:
    image_size: 64
    num_cyc_frozen: 1
    num_cyc_unfrozen: 0
    patience: 1
    starting_lr: 0.0001
    end_lr: 0.0005
    plot_lr_graph: false
    use_multitask: false
    use_semi_supervised: false
    use_pseudo_labeling: false
    downsample: true
    model:
      type: U_Net
      encoder_name: resnet34
      encoder_weights: null
  predict:
    quality: low
    output_probs: false
    output_entropy: false
    prediction_axis: Z
    downsample: true
  pipeline:
    schema_version: pipeline_v1
    heads:
      semantic:
        enabled: true
        loss: dice_ce
        loss_weight: 1.0
      boundary:
        enabled: true
        loss: boundary_bce_dice
        loss_weight: 0.5
        width: 2
    targets:
      boundary:
        width: 2
tests:
- name: train_downsample
  type: train
  model_key: downsample_model
  overrides:
    train:
      model_output_fn: downsample_model
  assert_outputs:
    should_exist_globs:
    - '*_loss_plot.png'
    - '*_train_stats.csv'
    - '*_prediction_image.png'
- name: assert_bn_trained_downsample
  type: pipeline_assert
  subcommand: checkpoint-trained
  args:
  - ${model:downsample_model}
- name: predict_downsample_low
  type: predict
  model_key: downsample_model
  overrides:
    predict:
      quality: low
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
    - '*_vol_pred_BND.*'
- name: assert_dice_downsample_low
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_downsample_low_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: predict_downsample_medium
  type: predict
  model_key: downsample_model
  overrides:
    predict:
      quality: medium
      output_probs: true
      output_entropy: true
  assert_outputs:
    should_exist_globs:
    - '*_vol_pred.*'
    - '*_vol_pred_BND.*'
- name: assert_dice_downsample_medium
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:predict_downsample_medium_pred}
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
- name: predict_downsample_zarr
  type: pipeline_predict_zarr
  model_key: downsample_model
  inference_mode: single_axis
  output_zarr: prediction.zarr
  zarr_key: downsample_zarr
- name: assert_zarr_keys_downsample
  type: pipeline_assert
  subcommand: zarr-keys
  args:
  - ${artifact:downsample_zarr}
  - --keys
  - teacher_argmax
  - teacher_probs
- name: assert_zarr_dice_downsample
  type: pipeline_assert
  subcommand: segmentation-dice
  args:
  - ${artifact:downsample_zarr}
  - --pred-key
  - teacher_argmax
  - --gt-label
  - ${path:label}
  - --min-dice
  - '0.0'
